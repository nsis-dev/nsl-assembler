name: Build and Test

on:
  push:
    branches: main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build with Gradle
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # all the LTS versions
        java: [ '8', '11', '17', '21' ]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Check code formatting
      # older versions are incompatible with our spotless version
      if: matrix.java == '17' || matrix.java == '21'
      run: ./gradlew spotlessCheck --no-daemon

    - name: Build and test with JDK ${{ matrix.java }}
      run: ./gradlew build --no-daemon -PjavaToolchain=${{ matrix.java }}
      env:
        GRADLE_OPTS: -Dorg.gradle.java.installations.auto-download=true

  e2e:
    name: Assemble and compile the e2e corpus
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    # makensis is the oracle the corpus asserts against; without it run.sh skips.
    # `latest` tracks the current release rather than pinning one, so record the
    # version: a red run caused by an NSIS upgrade should be distinguishable
    # from one caused by a change here.
    - name: Install NSIS
      uses: nsis-dev/setup-nsis@99783963764acafc24a5e3335ddfce26d03c20a2 # v1.2.1

    - name: Print NSIS version
      run: makensis -VERSION

    # One JDK only: the assembled .nsi does not vary by toolchain, so running
    # the corpus across the matrix would just spend CI minutes on makensis.
    # E2E_REQUIRE_MAKENSIS turns the skip path into a failure - in CI a missing
    # compiler is a broken workflow, not a reason to pass.
    - name: Run the e2e corpus
      run: ./e2e/run.sh
      env:
        E2E_REQUIRE_MAKENSIS: 1
        GRADLE_OPTS: -Dorg.gradle.java.installations.auto-download=true
